name: Publish npm on tag
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'alawein/siftgrain-cite'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Require released version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e 'const p=require("./package.json"); if(process.env.TAG!=="v"+p.version) process.exit(1)'
      - run: npm ci
      - run: npm install --global npm@12.2.0
      - run: npm run check:all
      - run: python -m unittest discover -s studies/ais-pilot -p test_analysis.py
      - run: npx playwright install --with-deps
      - run: npm run test:browser
      - run: npm publish --access public --provenance
